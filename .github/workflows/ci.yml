name: SEED-Core CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  security-audit:
    name: Supply Chain Security & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Cargo Audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  rust-verify:
    name: Rust Verification (Test, Clippy, Format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Linter
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Native Rust Unit Tests
        run: cargo test --verbose

      - name: Build Native Release Binaries & Libraries
        run: cargo build --release

  python-sdk-verify:
    name: Python SDK & Benchmark Verification
    runs-on: ubuntu-latest
    needs: rust-verify
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build Rust cdylib
        run: cargo build --release

      - name: Run Python SDK Unit & Integration Tests
        run: |
          python -m pip install --upgrade pip
          PYTHONPATH=python python python/test_python_sdk.py

      - name: Run JEV Migration Example Verification
        run: |
          PYTHONPATH=python python examples/migrate_from_jev.py

      - name: Run High-Throughput Micro-Benchmark
        run: ./bench/run_benchmarks.sh

      - name: Upload Benchmark Results Artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-latest
          path: bench/results/latest.json
          retention-days: 30

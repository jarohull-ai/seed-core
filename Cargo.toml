[package]
name = "seed-core"
version = "0.1.0"
edition = "2021"
authors = ["Jarosław Kuchta", "SEED AGI Core Team"]
description = "Deterministic Decision Engine, Real-Time Episodic Memory, and JFP Gatekeeper in Rust"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
parking_lot = "0.12"
regex = "1.10"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }

[[bin]]
name = "seed-core"
path = "src/main.rs"

[lib]
name = "seed_core"
path = "src/lib.rs"
